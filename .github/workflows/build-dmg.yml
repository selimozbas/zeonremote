name: Build DMG

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake jpeg-turbo pixman gnutls nettle libssh2 create-dmg

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTSERVER=OFF -DCODESIGN_IDENTITY=-
          cmake --build build -j

      - name: Make DMG
        run: tools/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ZeonVNC-dmg
          path: build/ZeonVNC-*.dmg

      # A version tag (v0.3.1) publishes the DMG as a GitHub release, with
      # the matching CHANGELOG.md section as release notes
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          gh release create "$GITHUB_REF_NAME" build/ZeonVNC-*.dmg \
            --title "ZeonVNC $version" --notes-file notes.md --latest
