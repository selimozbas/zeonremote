name: Build DMG

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Publish v<project version> as a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake jpeg-turbo pixman gnutls nettle libssh2 create-dmg

      # Xcode 26 or later compiles the macOS 26 app icon (resources/AppIcon.icon)
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Build
        run: |
          # The Homebrew libraries of the macos-15 runner need macOS 15
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTSERVER=ON -DCODESIGN_IDENTITY=- \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build build -j

      - name: Test
        run: tools/run-tests.sh build

      - name: Make DMG
        run: tools/make-dmg.sh

      - name: Check DMG
        run: tools/check-release.sh build/ZeonVNC-*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ZeonVNC-dmg
          path: build/ZeonVNC-*.dmg

      # A version tag (v0.3.1), or a manual run with "release" checked,
      # publishes the DMG as a GitHub release for the project version, with
      # the matching CHANGELOG.md section as release notes
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          version=$(sed -n 's/^project(ZeonVNC VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          version="${version%.0}"
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          dmg=$(ls build/ZeonVNC-*.dmg)
          assets=("$dmg")
          # Signed appcast for automatic updates (see "Automatic updates" in docs/BUILDING.md)
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            signature=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | build/sparkle-*/bin/sign_update --ed-key-file - "$dmg")
            min=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" build/src/ZeonVNC.app/Contents/Info.plist)
            tools/make-appcast.py "$dmg" "$signature" "$min" notes.md > build/appcast.xml
            assets+=(build/appcast.xml)
          else
            echo "::warning::SPARKLE_PRIVATE_KEY is not set, publishing without an appcast"
          fi
          gh release create "v$version" "${assets[@]}" --target "$GITHUB_SHA" \
            --title "ZeonVNC $version" --notes-file notes.md --latest
