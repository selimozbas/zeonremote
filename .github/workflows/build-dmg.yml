name: Build DMG

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Publish v<project version> as a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # The Icon Composer icon only compiles on macOS 26 or later
  icon:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile the app icon
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          tools/compile-icon.sh appicon

      - uses: actions/upload-artifact@v4
        with:
          name: appicon
          path: |
            appicon/Assets.car
            appicon/AppIcon.icns

  dmg:
    needs: icon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: appicon
          path: appicon

      - name: Install dependencies
        run: brew install cmake ninja jpeg-turbo pixman gnutls nettle libssh2 openssl@3 create-dmg

      # FreeRDP for RDP, only the libraries (and the sample server for the
      # tests); rebuilt when tools/build-freerdp.sh changes
      - uses: actions/cache@v4
        id: freerdp
        with:
          path: freerdp
          key: freerdp-macos15-${{ hashFiles('tools/build-freerdp.sh') }}

      - name: Build FreeRDP
        if: steps.freerdp.outputs.cache-hit != 'true'
        run: MACOSX_DEPLOYMENT_TARGET=15.0 tools/build-freerdp.sh freerdp --with-sample-server

      - name: Build
        run: |
          # The Homebrew libraries of the macos-15 runner need macOS 15
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTSERVER=ON -DCODESIGN_IDENTITY=- \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DZV_APPICON_DIR="$PWD/appicon" \
            -DFREERDP_DIR="$PWD/freerdp"
          cmake --build build -j

      - name: Test
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyftpdlib pyopenssl
          PYTHON="$RUNNER_TEMP/venv/bin/python" FREERDP_DIR="$PWD/freerdp" tools/run-tests.sh build

      - name: Make DMG
        run: tools/make-dmg.sh

      - name: Check DMG
        run: tools/check-release.sh build/ZeonRemote-*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ZeonRemote-dmg
          path: build/ZeonRemote-*.dmg

      # A version tag (v0.3.1), or a manual run with "release" checked,
      # publishes the DMG as a GitHub release for the project version, with
      # the matching CHANGELOG.md section as release notes
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          version=$(sed -n 's/^project(ZeonRemote VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          version="${version%.0}"
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          dmg=$(ls build/ZeonRemote-*.dmg)
          assets=("$dmg")
          # Signed appcast for automatic updates (see "Automatic updates" in docs/BUILDING.md)
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            signature=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | build/sparkle-*/bin/sign_update --ed-key-file - "$dmg")
            min=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" build/src/ZeonRemote.app/Contents/Info.plist)
            tools/make-appcast.py "$dmg" "$signature" "$min" notes.md > build/appcast.xml
            assets+=(build/appcast.xml)
          else
            echo "::warning::SPARKLE_PRIVATE_KEY is not set, publishing without an appcast"
          fi
          gh release create "v$version" "${assets[@]}" --target "$GITHUB_SHA" \
            --title "Zeon Remote $version" --notes-file notes.md --latest
